<article class="product-card product-card--new">
  <div class="product-card__media">
    <div class="product-card__gallery">
      <img class="product-card__image is-active" src="{{ img }}" alt="{{ name }}" width="109" height="200" loading="lazy">
    </div>
    <if condition="chip">
      <span class="product-card__chip {{ chipClass }}">{{ chip }}</span>
    </if>
  </div>
  <div class="product-card__info">
    <a class="product-card__name" href="{{ href }}">{{ name }}</a>
    <div class="product-card__prices">
      <span class="product-card__price">{{ price }}&nbsp;₽</span>
      <if condition="oldPrice">
        <s class="product-card__old-price">{{ oldPrice }}&nbsp;₽</s>
      </if>
    </div>
    <p class="product-card__stock">{{ stock }}</p>
    <div class="product-card__actions">
      <button class="product-card__cart" type="button">В корзину</button>
    </div>
  </div>
  <button class="product-card__fav" type="button" aria-pressed="false" aria-label="Добавить в избранное">
  </button>
</article>
