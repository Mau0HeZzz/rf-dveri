<li class="splide__slide">
  <a href="{{ href }}" class="catalog-banner" style="--banner-tint: {{ tint }}">
    <img class="catalog-banner__image" src="{{ img }}" alt="" loading="lazy">
    <span class="catalog-banner__content">
      <img class="catalog-banner__icon" src="/img/catalog-menu/banner-door.svg" alt="" width="27" height="27">
      <span class="catalog-banner__title">{{ title }}</span>
      <span class="catalog-banner__more">Подробнее</span>
    </span>
  </a>
</li>
