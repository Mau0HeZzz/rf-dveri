<article class="product-card product-card--new product-card--wide">
  <div class="product-card__media">
    <div class="product-card__gallery">
      <img class="product-card__image is-active" src="{{ img }}" alt="{{ name }}" width="179" height="192" loading="lazy">
    </div>
  </div>
  <div class="product-card__info">
    <div class="product-card__prices">
      <span class="product-card__price">{{ price }}&nbsp;<span class="product-card__currency">₽</span></span>
    </div>
    <a class="product-card__name" href="{{ href }}">{{ name }}</a>
    <div class="product-card__actions">
      <button class="product-card__cart" type="button">В корзину</button>
    </div>
  </div>
  <button class="product-card__fav" type="button" aria-pressed="false" aria-label="Добавить в избранное">
