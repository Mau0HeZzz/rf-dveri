      function symbolRainInit(canvas, context) {
        const CHARACTERS_ARR = [
          "Иван Можеев Лучшая Вёрстка",
          "Лучшая Вёрстка Иван Можеев",
          "+79775622197",
          "t.me/mau0hezzz",
          "mau0hezzz@hotmail.com"
        ];

        const fillStyle = canvas.hasAttribute('data-fill-style') ? canvas.getAttribute('data-fill-style') : 'green';
        const FONT_SIZE = canvas.hasAttribute('data-font-size') ? parseInt(canvas.getAttribute('data-font-size')) : 16;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        context.font = `bold ${FONT_SIZE}px monospace`;
        const columns = [];
        const columnsCount = canvas.width / FONT_SIZE;
        let charactersArrIndex = 0;
        for (let i = 0; i < columnsCount; i++) {
          if (!CHARACTERS_ARR[i]) {
            CHARACTERS_ARR[i] = CHARACTERS_ARR[charactersArrIndex];
            charactersArrIndex++;
          }
          columns.push(new RainColumn(i * FONT_SIZE, context, canvas.height, FONT_SIZE, CHARACTERS_ARR[i]));
        }
        rainAnimate();
        function rainAnimate() {
          context.fillStyle = 'rgba(0, 0, 0, 0.05)';
          context.fillRect(0, 0, canvas.width, canvas.height);

          context.fillStyle = fillStyle;
          columns.forEach(column => column.drawSymbol());
          setTimeout(() => {
            requestAnimationFrame(rainAnimate);
          }, 65);
        }
      }

      class RainColumn {
        constructor(x, context, canvasHeight, fontSize, CHARACTERS) {
          this.x = x;
          this.y = 0;
          this.fontSize = fontSize;
          this.context = context;
          this.canvasHeight = canvasHeight;
          this.characterIndex = 0;
          this.characters = CHARACTERS;
        }
        drawSymbol() {
          if (this.y === 0 && Math.random() < .98) {
            return;
          }

          const symbol = this.characters[this.characterIndex] ? this.characters[this.characterIndex].toUpperCase() : " ";
          if (this.characterIndex >= this.characters.length) {
            this.characterIndex = 0;
          } else {
            this.characterIndex++;
          }


          this.context.fillText(symbol, this.x, this.y);

          if (this.y > this.canvasHeight) {
            this.y = 0;
          } else {
            this.y += this.fontSize;
          }
        }
      }

  <script type="x-shader/x-fragment" id="vertShader">
      precision mediump float;

      varying vec2 vUv;
      attribute vec2 a_position;

      void main() {
          vUv = .5 * (a_position + 1.);
          gl_Position = vec4(a_position, 0.0, 1.0);
      }
  </script>
  <script type="x-shader/x-fragment" id="fragShader">
      precision mediump float;

      varying vec2 vUv;
      uniform float u_time;
      uniform float u_ratio;
      uniform vec2 u_pointer_position;
      uniform float u_scroll_progress;

      vec2 rotate(vec2 uv, float th) {
          return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv;
      }

      float neuro_shape(vec2 uv, float t, float p) {
          vec2 sine_acc = vec2(0.);
          vec2 res = vec2(0.);
          float scale = 8.;

          for (int j = 0; j < 15; j++) {
              uv = rotate(uv, 1.);
              sine_acc = rotate(sine_acc, 1.);
              vec2 layer = uv * scale + float(j) + sine_acc - t;
              sine_acc += sin(layer) + 2.4 * p;
              res += (.5 + .5 * cos(layer)) / scale;
              scale *= (1.2);
          }
          return res.x + res.y;
      }

      void main() {
          vec2 uv = .5 * vUv;
          uv.x *= u_ratio;

          vec2 pointer = vUv - u_pointer_position;
          pointer.x *= u_ratio;
          float p = clamp(length(pointer), 0., 1.);
          p = .5 * pow(1. - p, 2.);

          float t = .001 * u_time;
          vec3 color = vec3(0.);

          float noise = neuro_shape(uv, t, p);

          noise = 1.2 * pow(noise, 3.);
          noise += pow(noise, 10.);
          noise = max(.0, noise - .5);
          noise *= (1. - length(vUv - .5));

          color = normalize(vec3(.2, .5 + .4 * cos(3. * u_scroll_progress), .5 + .5 * sin(3. * u_scroll_progress)));

          color = color * noise;

          gl_FragColor = vec4(color, noise);
      }
  </script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const containerEl = document.querySelector(".container");
      const canvasEl = document.querySelector("canvas#neuro");
      const devicePixelRatio = Math.min(window.devicePixelRatio, 2);

      if (!canvasEl) return;
  
      const pointer = {
          x: 0,
          y: 0,
          tX: 0,
          tY: 0,
      };
  
  
      let uniforms;
      const gl = initShader({
        canvasEl
      });
  
      setupEvents();
  
      resizeCanvas({
        canvasEl,
        gl
      });
      window.addEventListener("resize", () => {
        resizeCanvas({
          canvasEl,
          gl
        })
      });
  
      render({
        pointer,
        gl
      });
    })

    function initShader({
      canvasEl
    }) {
        const vsSource = document.getElementById("vertShader").innerHTML;
        const fsSource = document.getElementById("fragShader").innerHTML;

        const gl = canvasEl.getContext("webgl") || canvasEl.getContext("experimental-webgl");

        if (!gl) {
            alert("WebGL is not supported by your browser.");
        }

        function createShader(gl, sourceCode, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, sourceCode);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("An error occurred compiling the shaders: " + gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }

            return shader;
        }

        const vertexShader = createShader(gl, vsSource, gl.VERTEX_SHADER);
        const fragmentShader = createShader(gl, fsSource, gl.FRAGMENT_SHADER);

        function createShaderProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error("Unable to initialize the shader program: " + gl.getProgramInfoLog(program));
                return null;
            }

            return program;
        }

        const shaderProgram = createShaderProgram(gl, vertexShader, fragmentShader);
        uniforms = getUniforms(shaderProgram);

        function getUniforms(program) {
            let uniforms = [];
            let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < uniformCount; i++) {
                let uniformName = gl.getActiveUniform(program, i).name;
                uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
            }
            return uniforms;
        }

        const vertices = new Float32Array([-1., -1., 1., -1., -1., 1., 1., 1.]);

        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        gl.useProgram(shaderProgram);

        const positionLocation = gl.getAttribLocation(shaderProgram, "a_position");
        gl.enableVertexAttribArray(positionLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        return gl;
    }

    function render({
      pointer,
      gl
    }) {
        const currentTime = performance.now();

        pointer.x += (pointer.tX - pointer.x) * .2;
        pointer.y += (pointer.tY - pointer.y) * .2;

        gl.uniform1f(uniforms.u_time, currentTime);
        gl.uniform2f(uniforms.u_pointer_position, pointer.x / window.innerWidth, 1 - pointer.y / window.innerHeight);
        gl.uniform1f(uniforms.u_scroll_progress, window["pageYOffset"] / (2 * window.innerHeight));

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(() => {
          render({
            pointer,
            gl
          })
        });
    }

    function resizeCanvas({
      canvasEl,
      gl
    }) {
        canvasEl.width = window.innerWidth * devicePixelRatio;
        canvasEl.height = window.innerHeight * devicePixelRatio;
        gl.uniform1f(uniforms.u_ratio, canvasEl.width / canvasEl.height);
        gl.viewport(0, 0, canvasEl.width, canvasEl.height);
    }

    function setupEvents() {
        window.addEventListener("pointermove", e => {
            updateMousePosition(e.clientX, e.clientY);
        });
        window.addEventListener("touchmove", e => {
            updateMousePosition(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
        });
        window.addEventListener("click", e => {
            updateMousePosition(e.clientX, e.clientY);
        });

        function updateMousePosition(eX, eY) {
            pointer.tX = eX;
            pointer.tY = eY;
        }
    }
  </script>

  <script defer>
    /**
     * WebGL fluid-симуляция для фонового canvas-эффекта

    function lightShadower() {
      const canvas = document.getElementById('light-shadower');
      if (!canvas) return;

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      let simWidth, simHeight, dyeWidth, dyeHeight;
      let dye, velocity, divergenceFBO, curlFBO, pressure, bloomFBO;

      const config = {
        SIM_RESOLUTION: 128,
        DYE_RESOLUTION: 512,
        DENSITY_DISSIPATION: 0.97,
        VELOCITY_DISSIPATION: 0.98,
        PRESSURE_DISSIPATION: 0.8,
        PRESSURE_ITERATIONS: 10,
        CURL: 5,
        SPLAT_RADIUS: 0.2,
        SHADING: true,
        COLORFUL: true,
        PAUSED: false,
        BACK_COLOR: { r: 15, g: 15, b: 15 },
        TRANSPARENT: false,
        BLOOM: false,
        BLOOM_ITERATIONS: 8,
        BLOOM_RESOLUTION: 256,
        BLOOM_INTENSITY: 0.8,
        BLOOM_THRESHOLD: 0.6,
        BLOOM_SOFT_KNEE: 0.7,
      };

      function Pointer() {
        this.id = -1;
        this.x = 0;
        this.y = 0;
        this.dx = 0;
        this.dy = 0;
        this.down = false;
        this.moved = false;
        this.color = [30, 0, 300];
      }

      const pointers = [new Pointer()];
      const splatStack = [];
      const bloomFramebuffers = [];

      const { gl, ext } = initWebGL(canvas);

      function getSupportedFormat(glCtx, internalFormat, format, type) {
        const tex = glCtx.createTexture();
        glCtx.bindTexture(glCtx.TEXTURE_2D, tex);
        glCtx.texParameteri(glCtx.TEXTURE_2D, glCtx.TEXTURE_MIN_FILTER, glCtx.NEAREST);
        glCtx.texParameteri(glCtx.TEXTURE_2D, glCtx.TEXTURE_MAG_FILTER, glCtx.NEAREST);
        glCtx.texParameteri(glCtx.TEXTURE_2D, glCtx.TEXTURE_WRAP_S, glCtx.CLAMP_TO_EDGE);
        glCtx.texParameteri(glCtx.TEXTURE_2D, glCtx.TEXTURE_WRAP_T, glCtx.CLAMP_TO_EDGE);
        glCtx.texImage2D(glCtx.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);

        const fbo = glCtx.createFramebuffer();
        glCtx.bindFramebuffer(glCtx.FRAMEBUFFER, fbo);
        glCtx.framebufferTexture2D(glCtx.FRAMEBUFFER, glCtx.COLOR_ATTACHMENT0, glCtx.TEXTURE_2D, tex, 0);

        if (glCtx.checkFramebufferStatus(glCtx.FRAMEBUFFER) !== glCtx.FRAMEBUFFER_COMPLETE) {
          switch (internalFormat) {
            case glCtx.R16F:
              return getSupportedFormat(glCtx, glCtx.RG16F, glCtx.RG, type);
            case glCtx.RG16F:
              return getSupportedFormat(glCtx, glCtx.RGBA16F, glCtx.RGBA, type);
            default:
              return null;
          }
        }

        return { internalFormat, format };
      }

      function initWebGL(canvasEl) {
        const params = {
          alpha: true,
          depth: false,
          stencil: false,
          antialias: false,
          preserveDrawingBuffer: false,
        };

        let glCtx = canvasEl.getContext('webgl2', params);
        const isWebGL2 = !!glCtx;

        if (!isWebGL2) {
          glCtx = canvasEl.getContext('webgl', params) || canvasEl.getContext('experimental-webgl', params);
        }

        let halfFloat, linearFiltering, formatRGBA, formatRG, formatR;

        if (isWebGL2) {
          glCtx.getExtension('EXT_color_buffer_float');
          linearFiltering = glCtx.getExtension('OES_texture_float_linear');
        } else {
          halfFloat = glCtx.getExtension('OES_texture_half_float');
          linearFiltering = glCtx.getExtension('OES_texture_half_float_linear');
        }

        glCtx.clearColor(0, 0, 0, 1);

        const halfFloatType = isWebGL2 ? glCtx.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;

        if (isWebGL2) {
          formatRGBA = getSupportedFormat(glCtx, glCtx.RGBA16F, glCtx.RGBA, halfFloatType);
          formatRG = getSupportedFormat(glCtx, glCtx.RG16F, glCtx.RG, halfFloatType);
          formatR = getSupportedFormat(glCtx, glCtx.R16F, glCtx.RED, halfFloatType);
        } else {
          formatRGBA = getSupportedFormat(glCtx, glCtx.RGBA, glCtx.RGBA, halfFloatType);
          formatRG = getSupportedFormat(glCtx, glCtx.RGBA, glCtx.RGBA, halfFloatType);
          formatR = getSupportedFormat(glCtx, glCtx.RGBA, glCtx.RGBA, halfFloatType);
        }

        return {
          gl: glCtx,
          ext: {
            formatRGBA,
            formatRG,
            formatR,
            halfFloatTexType: halfFloatType,
            supportLinearFiltering: linearFiltering,
          },
        };
      }

      if (/Mobi|Android/i.test(navigator.userAgent)) config.SHADING = false;
      if (!ext.supportLinearFiltering) {
        config.SHADING = false;
        config.BLOOM = false;
      }

      class GLProgram {
        constructor(vertexShader, fragmentShader) {
          this.uniforms = {};
          this.program = gl.createProgram();
          gl.attachShader(this.program, vertexShader);
          gl.attachShader(this.program, fragmentShader);
          gl.linkProgram(this.program);

          if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
            throw gl.getProgramInfoLog(this.program);
          }

          const uniformCount = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < uniformCount; i++) {
            const name = gl.getActiveUniform(this.program, i).name;
            this.uniforms[name] = gl.getUniformLocation(this.program, name);
          }
        }

        bind() {
          gl.useProgram(this.program);
        }
      }

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw gl.getShaderInfoLog(shader);
        }
        return shader;
      }

      // --- Шейдеры ---
      const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
        precision highp float;
        attribute vec2 aPosition;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 texelSize;
        void main () {
          vUv = aPosition * 0.5 + 0.5;
          vL = vUv - vec2(texelSize.x, 0.0);
          vR = vUv + vec2(texelSize.x, 0.0);
          vT = vUv + vec2(0.0, texelSize.y);
          vB = vUv - vec2(0.0, texelSize.y);
          gl_Position = vec4(aPosition, 0.0, 1.0);
        }
      `);

      const clearShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;
        uniform float value;
        void main () {
          gl_FragColor = value * texture2D(uTexture, vUv);
        }
      `);

      const colorShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform vec4 color;
        void main () {
          gl_FragColor = color;
        }
      `);

      const checkerboardShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform float aspectRatio;
        #define SCALE 25.0
        void main () {
          vec2 uv = floor(vUv * SCALE * vec2(aspectRatio, 1.0));
          float v = mod(uv.x + uv.y, 2.0);
          v = v * 0.1 + 0.8;
          gl_FragColor = vec4(vec3(v), 1.0);
        }
      `);

      const displayShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        void main () {
          vec3 C = texture2D(uTexture, vUv).rgb;
          float a = max(C.r, max(C.g, C.b));
          gl_FragColor = vec4(C, a);
        }
      `);

      const displayBloomShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform sampler2D uBloom;
        uniform sampler2D uDithering;
        uniform vec2 ditherScale;
        void main () {
          vec3 C = texture2D(uTexture, vUv).rgb;
          vec3 bloom = texture2D(uBloom, vUv).rgb;
          vec3 noise = texture2D(uDithering, vUv * ditherScale).rgb;
          noise = noise * 2.0 - 1.0;
          bloom += noise / 800.0;
          bloom = pow(bloom.rgb, vec3(1.0 / 2.2));
          C += bloom;
          float a = max(C.r, max(C.g, C.b));
          gl_FragColor = vec4(C, a);
        }
      `);

      const displayShadingShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform vec2 texelSize;
        void main () {
          vec3 L = texture2D(uTexture, vL).rgb;
          vec3 R = texture2D(uTexture, vR).rgb;
          vec3 T = texture2D(uTexture, vT).rgb;
          vec3 B = texture2D(uTexture, vB).rgb;
          vec3 C = texture2D(uTexture, vUv).rgb;
          float dx = length(R) - length(L);
          float dy = length(T) - length(B);
          vec3 n = normalize(vec3(dx, dy, length(texelSize)));
          vec3 l = vec3(0.0, 0.0, 1.0);
          float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
          C.rgb *= diffuse;
          float a = max(C.r, max(C.g, C.b));
          gl_FragColor = vec4(C, a);
        }
      `);

      const displayBloomShadingShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform sampler2D uBloom;
        uniform sampler2D uDithering;
        uniform vec2 ditherScale;
        uniform vec2 texelSize;
        void main () {
          vec3 L = texture2D(uTexture, vL).rgb;
          vec3 R = texture2D(uTexture, vR).rgb;
          vec3 T = texture2D(uTexture, vT).rgb;
          vec3 B = texture2D(uTexture, vB).rgb;
          vec3 C = texture2D(uTexture, vUv).rgb;
          float dx = length(R) - length(L);
          float dy = length(T) - length(B);
          vec3 n = normalize(vec3(dx, dy, length(texelSize)));
          vec3 l = vec3(0.0, 0.0, 1.0);
          float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
          C *= diffuse;
          vec3 bloom = texture2D(uBloom, vUv).rgb;
          vec3 noise = texture2D(uDithering, vUv * ditherScale).rgb;
          noise = noise * 2.0 - 1.0;
          bloom += noise / 800.0;
          bloom = pow(bloom.rgb, vec3(1.0 / 2.2));
          C += bloom;
          float a = max(C.r, max(C.g, C.b));
          gl_FragColor = vec4(C, a);
        }
      `);

      const bloomPrefilterShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform vec3 curve;
        uniform float threshold;
        void main () {
          vec3 c = texture2D(uTexture, vUv).rgb;
          float br = max(c.r, max(c.g, c.b));
          float rq = clamp(br - curve.x, 0.0, curve.y);
          rq = curve.z * rq * rq;
          c *= max(rq, br - threshold) / max(br, 0.0001);
          gl_FragColor = vec4(c, 0.0);
        }
      `);

      const bloomBlurShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        void main () {
          vec4 sum = vec4(0.0);
          sum += texture2D(uTexture, vL);
          sum += texture2D(uTexture, vR);
          sum += texture2D(uTexture, vT);
          sum += texture2D(uTexture, vB);
          sum *= 0.25;
          gl_FragColor = sum;
        }
      `);

      const bloomFinalShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform float intensity;
        void main () {
          vec4 sum = vec4(0.0);
          sum += texture2D(uTexture, vL);
          sum += texture2D(uTexture, vR);
          sum += texture2D(uTexture, vT);
          sum += texture2D(uTexture, vB);
          sum *= 0.25;
          gl_FragColor = sum * intensity;
        }
      `);

      const splatShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTarget;
        uniform float aspectRatio;
        uniform vec3 color;
        uniform vec2 point;
        uniform float radius;
        void main () {
          vec2 p = vUv - point.xy;
          p.x *= aspectRatio;
          vec3 splat = exp(-dot(p, p) / radius) * color;
          vec3 base = texture2D(uTarget, vUv).xyz;
          gl_FragColor = vec4(base + splat, 1.0);
        }
      `);

      const advectionManualFilteringShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform vec2 dyeTexelSize;
        uniform float dt;
        uniform float dissipation;
        vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
          vec2 st = uv / tsize - 0.5;
          vec2 iuv = floor(st);
          vec2 fuv = fract(st);
          vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
          vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
          vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
          vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
          return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
        }
        void main () {
          vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
          gl_FragColor = dissipation * bilerp(uSource, coord, dyeTexelSize);
          gl_FragColor.a = 1.0;
        }
      `);

      const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform float dt;
        uniform float dissipation;
        void main () {
          vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
          gl_FragColor = dissipation * texture2D(uSource, coord);
          gl_FragColor.a = 1.0;
        }
      `);

      const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
          float L = texture2D(uVelocity, vL).x;
          float R = texture2D(uVelocity, vR).x;
          float T = texture2D(uVelocity, vT).y;
          float B = texture2D(uVelocity, vB).y;
          vec2 C = texture2D(uVelocity, vUv).xy;
          if (vL.x < 0.0) { L = -C.x; }
          if (vR.x > 1.0) { R = -C.x; }
          if (vT.y > 1.0) { T = -C.y; }
          if (vB.y < 0.0) { B = -C.y; }
          float div = 0.5 * (R - L + T - B);
          gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
        }
      `);

      const curlShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
          float L = texture2D(uVelocity, vL).y;
          float R = texture2D(uVelocity, vR).y;
          float T = texture2D(uVelocity, vT).x;
          float B = texture2D(uVelocity, vB).x;
          float vorticity = R - L - T + B;
          gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
        }
      `);

      const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform float curl;
        uniform float dt;
        void main () {
          float L = texture2D(uCurl, vL).x;
          float R = texture2D(uCurl, vR).x;
          float T = texture2D(uCurl, vT).x;
          float B = texture2D(uCurl, vB).x;
          float C = texture2D(uCurl, vUv).x;
          vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
          force /= length(force) + 0.0001;
          force *= curl * C;
          force.y *= -1.0;
          vec2 vel = texture2D(uVelocity, vUv).xy;
          gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
        }
      `);

      const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        vec2 boundary (vec2 uv) {
          return uv;
        }
        void main () {
          float L = texture2D(uPressure, boundary(vL)).x;
          float R = texture2D(uPressure, boundary(vR)).x;
          float T = texture2D(uPressure, boundary(vT)).x;
          float B = texture2D(uPressure, boundary(vB)).x;
          float C = texture2D(uPressure, vUv).x;
          float divergence = texture2D(uDivergence, vUv).x;
          float pressure = (L + R + B + T - divergence) * 0.25;
          gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
        }
      `);

      const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        vec2 boundary (vec2 uv) {
          return uv;
        }
        void main () {
          float L = texture2D(uPressure, boundary(vL)).x;
          float R = texture2D(uPressure, boundary(vR)).x;
          float T = texture2D(uPressure, boundary(vT)).x;
          float B = texture2D(uPressure, boundary(vB)).x;
          vec2 velocity = texture2D(uVelocity, vUv).xy;
          velocity.xy -= vec2(R - L, T - B);
          gl_FragColor = vec4(velocity, 0.0, 1.0);
        }
      `);

      // --- Геометрия (fullscreen quad) ---
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(0);

      function blit(target) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, target);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      }

      // --- Программы ---
      const clearProgram            = new GLProgram(baseVertexShader, clearShader);
      const colorProgram            = new GLProgram(baseVertexShader, colorShader);
      const checkerboardProgram     = new GLProgram(baseVertexShader, checkerboardShader);
      const displayProgram          = new GLProgram(baseVertexShader, displayShader);
      const displayBloomProgram     = new GLProgram(baseVertexShader, displayBloomShader);
      const displayShadingProgram   = new GLProgram(baseVertexShader, displayShadingShader);
      const displayBloomShadingProgram = new GLProgram(baseVertexShader, displayBloomShadingShader);
      const bloomPrefilterProgram   = new GLProgram(baseVertexShader, bloomPrefilterShader);
      const bloomBlurProgram        = new GLProgram(baseVertexShader, bloomBlurShader);
      const bloomFinalProgram       = new GLProgram(baseVertexShader, bloomFinalShader);
      const splatProgram            = new GLProgram(baseVertexShader, splatShader);
      const advectionProgram        = new GLProgram(baseVertexShader, ext.supportLinearFiltering ? advectionShader : advectionManualFilteringShader);
      const divergenceProgram       = new GLProgram(baseVertexShader, divergenceShader);
      const curlProgram             = new GLProgram(baseVertexShader, curlShader);
      const vorticityProgram        = new GLProgram(baseVertexShader, vorticityShader);
      const pressureProgram         = new GLProgram(baseVertexShader, pressureShader);
      const gradientSubtractProgram = new GLProgram(baseVertexShader, gradientSubtractShader);

      // --- Framebuffer-ы ---
      function createFBO(w, h, internalFormat, format, type, filter) {
        gl.activeTexture(gl.TEXTURE0);
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT);

        return {
          texture,
          fbo,
          width: w,
          height: h,
          attach(unit) {
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            return unit;
          },
        };
      }

      function createDoubleFBO(w, h, internalFormat, format, type, filter) {
        let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
        let fbo2 = createFBO(w, h, internalFormat, format, type, filter);

        return {
          get read() { return fbo1; },
          set read(value) { fbo1 = value; },
          get write() { return fbo2; },
          set write(value) { fbo2 = value; },
          swap() {
            const tmp = fbo1;
            fbo1 = fbo2;
            fbo2 = tmp;
          },
        };
      }

      function resizeDoubleFBO(target, w, h, internalFormat, format, type, filter) {
        const oldRead = target.read;
        const newRead = createFBO(w, h, internalFormat, format, type, filter);
        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, oldRead.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, 1);
        blit(newRead.fbo);
        target.read = newRead;
        target.write = createFBO(w, h, internalFormat, format, type, filter);
        return target;
      }

      function getResolution(resolution) {
        let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
        if (aspectRatio < 1) aspectRatio = 1 / aspectRatio;

        const max = Math.round(resolution * aspectRatio);
        const min = Math.round(resolution);

        return gl.drawingBufferWidth > gl.drawingBufferHeight
          ? { width: max, height: min }
          : { width: min, height: max };
      }

      function initFramebuffers() {
        const simRes = getResolution(config.SIM_RESOLUTION);
        const dyeRes = getResolution(config.DYE_RESOLUTION);

        simWidth  = simRes.width;
        simHeight = simRes.height;
        dyeWidth  = dyeRes.width;
        dyeHeight = dyeRes.height;

        const texType = ext.halfFloatTexType;
        const rgba    = ext.formatRGBA;
        const rg      = ext.formatRG;
        const r       = ext.formatR;
        const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

        dye = dye == null
          ? createDoubleFBO(dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering)
          : resizeDoubleFBO(dye, dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering);

        velocity = velocity == null
          ? createDoubleFBO(simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering)
          : resizeDoubleFBO(velocity, simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering);

        divergenceFBO = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        curlFBO       = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        pressure      = createDoubleFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);

        initBloomFramebuffers();
      }

      function initBloomFramebuffers() {
        const res       = getResolution(config.BLOOM_RESOLUTION);
        const texType   = ext.halfFloatTexType;
        const rgba      = ext.formatRGBA;
        const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

        bloomFBO = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, filtering);
        bloomFramebuffers.length = 0;

        for (let i = 0; i < config.BLOOM_ITERATIONS; i++) {
          const w = res.width >> (i + 1);
          const h = res.height >> (i + 1);
          if (w < 2 || h < 2) break;
          bloomFramebuffers.push(createFBO(w, h, rgba.internalFormat, rgba.format, texType, filtering));
        }
      }

      initFramebuffers();

      // --- HSV → RGB ---
      function HSVtoRGB(h, s, v) {
        const i = Math.floor(6 * h);
        const f = 6 * h - i;
        const p = v * (1 - s);
        const q = v * (1 - f * s);
        const t = v * (1 - (1 - f) * s);

        let r, g, b;
        switch (i % 6) {
          case 0: r = v; g = t; b = p; break;
          case 1: r = q; g = v; b = p; break;
          case 2: r = p; g = v; b = t; break;
          case 3: r = p; g = q; b = v; break;
          case 4: r = t; g = p; b = v; break;
          case 5: r = v; g = p; b = q; break;
        }
        return { r, g, b };
      }

      function generateColor() {
        const color = HSVtoRGB(Math.random(), 1, 1);
        color.r *= 0.15;
        color.g *= 0.15;
        color.b *= 0.15;
        return color;
      }

      function getTextureScale(texture, width, height) {
        return {
          x: width / texture.width,
          y: height / texture.height,
        };
      }

      // --- Splat (точка воздействия) ---
      function splat(x, y, dx, dy, color) {
        gl.viewport(0, 0, simWidth, simHeight);
        splatProgram.bind();
        gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
        gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
        gl.uniform2f(splatProgram.uniforms.point, x / canvas.width, 1 - y / canvas.height);
        gl.uniform3f(splatProgram.uniforms.color, dx, -dy, 1);
        gl.uniform1f(splatProgram.uniforms.radius, config.SPLAT_RADIUS / 100);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);
        gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
        gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
        blit(dye.write.fbo);
        dye.swap();
      }

      // --- Шаг симуляции ---
      function step(dt) {
        gl.disable(gl.BLEND);
        gl.viewport(0, 0, simWidth, simHeight);

        curlProgram.bind();
        gl.uniform2f(curlProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(curlFBO.fbo);

        vorticityProgram.bind();
        gl.uniform2f(vorticityProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(vorticityProgram.uniforms.uCurl, curlFBO.attach(1));
        gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
        gl.uniform1f(vorticityProgram.uniforms.dt, dt);
        blit(velocity.write.fbo);
        velocity.swap();

        divergenceProgram.bind();
        gl.uniform2f(divergenceProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(divergenceFBO.fbo);

        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE_DISSIPATION);
        blit(pressure.write.fbo);
        pressure.swap();

        pressureProgram.bind();
        gl.uniform2f(pressureProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        gl.uniform1i(pressureProgram.uniforms.uDivergence, divergenceFBO.attach(0));
        for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
          gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
          blit(pressure.write.fbo);
          pressure.swap();
        }

        gradientSubtractProgram.bind();
        gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
        gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
        blit(velocity.write.fbo);
        velocity.swap();

        advectionProgram.bind();
        gl.uniform2f(advectionProgram.uniforms.texelSize, 1 / simWidth, 1 / simHeight);
        if (!ext.supportLinearFiltering) {
          gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1 / simWidth, 1 / simHeight);
        }
        const velUnit = velocity.read.attach(0);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velUnit);
        gl.uniform1i(advectionProgram.uniforms.uSource, velUnit);
        gl.uniform1f(advectionProgram.uniforms.dt, dt);
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);
        if (!ext.supportLinearFiltering) {
          gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1 / dyeWidth, 1 / dyeHeight);
        }
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
        blit(dye.write.fbo);
        dye.swap();
      }

      // --- Bloom ---
      function applyBloom(source, destination) {
        if (bloomFramebuffers.length < 2) return;

        let last = destination;
        gl.disable(gl.BLEND);

        bloomPrefilterProgram.bind();
        const knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
        const curve0 = config.BLOOM_THRESHOLD - knee;
        gl.uniform3f(bloomPrefilterProgram.uniforms.curve, curve0, 2 * knee, 0.25 / knee);
        gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, config.BLOOM_THRESHOLD);
        gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, source.attach(0));
        gl.viewport(0, 0, last.width, last.height);
        blit(last.fbo);

        bloomBlurProgram.bind();
        for (let i = 0; i < bloomFramebuffers.length; i++) {
          const dest = bloomFramebuffers[i];
          gl.uniform2f(bloomBlurProgram.uniforms.texelSize, 1 / last.width, 1 / last.height);
          gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
          gl.viewport(0, 0, dest.width, dest.height);
          blit(dest.fbo);
          last = dest;
        }

        gl.blendFunc(gl.ONE, gl.ONE);
        gl.enable(gl.BLEND);
        for (let i = bloomFramebuffers.length - 2; i >= 0; i--) {
          const dest = bloomFramebuffers[i];
          gl.uniform2f(bloomBlurProgram.uniforms.texelSize, 1 / last.width, 1 / last.height);
          gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
          gl.viewport(0, 0, dest.width, dest.height);
          blit(dest.fbo);
          last = dest;
        }

        gl.disable(gl.BLEND);
        bloomFinalProgram.bind();
        gl.uniform2f(bloomFinalProgram.uniforms.texelSize, 1 / last.width, 1 / last.height);
        gl.uniform1i(bloomFinalProgram.uniforms.uTexture, last.attach(0));
        gl.uniform1f(bloomFinalProgram.uniforms.intensity, config.BLOOM_INTENSITY);
        gl.viewport(0, 0, destination.width, destination.height);
        blit(destination.fbo);
      }

      // --- Отрисовка ---
      function render(target) {
        if (config.BLOOM) {
          applyBloom(dye.read, bloomFBO);
        }

        if (target != null && config.TRANSPARENT) {
          gl.disable(gl.BLEND);
        } else {
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.enable(gl.BLEND);
        }

        const width  = target == null ? gl.drawingBufferWidth  : dyeWidth;
        const height = target == null ? gl.drawingBufferHeight : dyeHeight;
        gl.viewport(0, 0, width, height);

        if (!config.TRANSPARENT) {
          colorProgram.bind();
          const bg = config.BACK_COLOR;
          gl.uniform4f(colorProgram.uniforms.color, bg.r / 255, bg.g / 255, bg.b / 255, 1);
          blit(target);
        }

        if (target == null && config.TRANSPARENT) {
          checkerboardProgram.bind();
          gl.uniform1f(checkerboardProgram.uniforms.aspectRatio, canvas.width / canvas.height);
          blit(null);
        }

        if (config.SHADING) {
          const program = config.BLOOM ? displayBloomShadingProgram : displayShadingProgram;
          program.bind();
          gl.uniform2f(program.uniforms.texelSize, 1 / width, 1 / height);
          gl.uniform1i(program.uniforms.uTexture, dye.read.attach(0));
        } else {
          const program = config.BLOOM ? displayBloomProgram : displayProgram;
          program.bind();
          gl.uniform1i(program.uniforms.uTexture, dye.read.attach(0));
        }

        blit(target);
      }

      // --- Главный цикл ---
      let lastColorChangeTime = Date.now();

      function update() {
        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          initFramebuffers();
        }

        handleInput();

        if (!config.PAUSED) {
          step(0.016);
        }

        render(null);
        requestAnimationFrame(update);
      }

      function handleInput() {
        if (splatStack.length > 0) {
          multipleSplats(splatStack.pop());
        }

        for (let i = 0; i < pointers.length; i++) {
          const p = pointers[i];
          if (p.moved) {
            splat(p.x, p.y, p.dx, p.dy, p.color);
            p.moved = false;
          }
        }

        if (config.COLORFUL && lastColorChangeTime + 100 < Date.now()) {
          lastColorChangeTime = Date.now();
          for (let i = 0; i < pointers.length; i++) {
            pointers[i].color = generateColor();
          }
        }
      }

      function multipleSplats(amount) {
        for (let i = 0; i < amount; i++) {
          const color = generateColor();
          color.r *= 10;
          color.g *= 10;
          color.b *= 10;
          splat(
            canvas.width * Math.random(),
            canvas.height * Math.random(),
            1000 * (Math.random() - 0.5),
            1000 * (Math.random() - 0.5),
            color
          );
        }
      }

      update();

      // --- События ---
      window.addEventListener('mousemove', (e) => {
        pointers[0].moved = true;
        pointers[0].dx = (e.clientX - pointers[0].x) * 5;
        pointers[0].dy = (e.clientY - pointers[0].y) * 5;
        pointers[0].x = e.clientX;
        pointers[0].y = e.clientY;
        pointers[0].color = generateColor();
      });

      window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
          const p = pointers[i];
          p.moved = p.down;
          p.dx = (touches[i].clientX - p.x) * 8;
          p.dy = (touches[i].clientY - p.y) * 8;
          p.x = touches[i].clientX;
          p.y = touches[i].clientY;
        }
      }, false);

      window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
          if (i >= pointers.length) pointers.push(new Pointer());
          pointers[i].id = touches[i].identifier;
          pointers[i].down = true;
          pointers[i].x = touches[i].pageX;
          pointers[i].y = touches[i].pageY;
          pointers[i].color = generateColor();
        }
      });

      window.addEventListener('mouseup', () => {
        pointers[0].down = false;
      });

      window.addEventListener('touchend', (e) => {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
          for (let j = 0; j < pointers.length; j++) {
            if (touches[i].identifier === pointers[j].id) {
              pointers[j].down = false;
            }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', lightShadower);
  </script>
</html>
