<style>
  body {
    margin: 0;
    padding: 12px;
    font: 12px/1.4 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  h3 { margin: 0 0 6px; font-size: 13px; }
  .hint { margin: 0 0 10px; color: var(--figma-color-text-secondary, #777); }
  label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  input[type="text"] {
    flex: 1;
    padding: 4px 6px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--figma-color-border, #ddd);
    border-radius: 4px;
  }
  button {
    width: 100%;
    margin: 6px 0 10px;
    padding: 8px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--figma-color-bg-brand, #0d99ff);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { min-height: 18px; font-weight: 600; }
  #log {
    height: 220px;
    margin: 6px 0 0;
    padding: 6px;
    overflow: auto;
    white-space: pre-wrap;
    font: 11px/1.4 ui-monospace, monospace;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    border-radius: 4px;
  }
</style>

<h3>Экспорт для вёрстки</h3>
<p class="hint">Выделите фреймы (Desktop, Mobile) и нажмите «Экспорт». Если локальный сервер не запущен, скачается ZIP.</p>
<label><input type="checkbox" id="optCss" checked> CSS из Dev Mode для каждого слоя</label>
<label><input type="checkbox" id="optPreviews" checked> PNG-превью страниц и секций</label>
<label>Сервер <input type="text" id="server" value="http://localhost:3717"></label>
<button id="run">Экспорт</button>
<div id="status"></div>
<pre id="log"></pre>

<script>
  // Кнопка запуска экспорта
  const runBtn = document.getElementById('run');
  // Строка текущего статуса
  const statusEl = document.getElementById('status');
  // Журнал сообщений
  const logEl = document.getElementById('log');

  // Режим сохранения: 'server' или 'zip'
  let mode = 'zip';
  // Адрес локального сервера без завершающего слеша
  let serverUrl = '';
  // Цепочка последовательных загрузок на сервер
  let queue = Promise.resolve();
  // Файлы для ZIP (все в режиме zip, только неудачные в режиме server)
  let zipFiles = [];
  // Количество сохранённых на сервер файлов
  let saved = 0;

  /**
   * Добавляет строку в журнал
   */
  function log(text) {
    logEl.textContent += text + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  /**
   * Обновляет строку статуса
   */
  function setStatus(text) {
    statusEl.textContent = text;
  }

  /**
   * Проверяет, что локальный сервер отвечает
   */
  async function ping() {
    try {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 1500);
      const res = await fetch(serverUrl + '/ping', { signal: controller.signal });
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  /**
   * Отправляет файл на локальный сервер; при ошибке откладывает его в ZIP
   */
  async function upload(path, data) {
    try {
      const res = await fetch(`${serverUrl}/file?path=${encodeURIComponent(path)}`, { method: 'POST', body: data });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      saved++;
      setStatus(`Сохранено файлов: ${saved}`);
    } catch (e) {
      zipFiles.push({ path, data });
      log(`Не сохранён ${path}: ${e.message}`);
    }
  }

  /**
   * Возвращает CRC32 массива байт
   */
  function crc32(bytes) {
    if (!crc32.table) {
      crc32.table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        crc32.table[n] = c >>> 0;
      }
    }
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = crc32.table[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  /**
   * Возвращает ZIP-архив (без сжатия) из списка файлов
   */
  function makeZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;

    for (const file of files) {
      const name = encoder.encode(file.path);
      const crc = crc32(file.data);
      const size = file.data.length;

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);
      local.setUint16(12, 33, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);
      local.setUint32(22, size, true);
      local.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(local.buffer), name, file.data);

      const entry = new DataView(new ArrayBuffer(46));
      entry.setUint32(0, 0x02014b50, true);
      entry.setUint16(4, 20, true);
      entry.setUint16(6, 20, true);
      entry.setUint16(8, 0x0800, true);
      entry.setUint16(14, 33, true);
      entry.setUint32(16, crc, true);
      entry.setUint32(20, size, true);
      entry.setUint32(24, size, true);
      entry.setUint16(28, name.length, true);
      entry.setUint32(42, offset, true);
      central.push(new Uint8Array(entry.buffer), name);

      offset += 30 + name.length + size;
    }

    const centralSize = central.reduce((sum, c) => sum + c.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }

  /**
   * Скачивает накопленные файлы одним ZIP-архивом
   */
  function downloadZip() {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(makeZip(zipFiles));
    link.download = 'figma-export.zip';
    document.body.appendChild(link);
    link.click();
    link.remove();
    log(`ZIP: ${zipFiles.length} файлов. Распакуйте его в папку .design проекта.`);
  }

  runBtn.onclick = async () => {
    runBtn.disabled = true;
    logEl.textContent = '';
    serverUrl = document.getElementById('server').value.trim().replace(/\/+$/, '');
    zipFiles = [];
    saved = 0;
    queue = Promise.resolve();
    mode = (await ping()) ? 'server' : 'zip';
    log(mode === 'server' ? `Сохраняю через ${serverUrl}` : 'Сервер не отвечает — соберу ZIP');
    parent.postMessage({
      pluginMessage: {
        type: 'export',
        options: {
          css: document.getElementById('optCss').checked,
          previews: document.getElementById('optPreviews').checked,
        },
      },
    }, '*');
  };

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'clear') {
      if (mode === 'server') {
        queue = queue.then(() => fetch(`${serverUrl}/clear?path=${encodeURIComponent(msg.path)}`, { method: 'POST' }).catch(() => {}));
      }
    } else if (msg.type === 'file') {
      const data = typeof msg.data === 'string' ? new TextEncoder().encode(msg.data) : msg.data;
      if (mode === 'server') queue = queue.then(() => upload(msg.path, data));
      else zipFiles.push({ path: msg.path, data });
    } else if (msg.type === 'progress') {
      setStatus(msg.text);
    } else if (msg.type === 'log') {
      log(msg.text);
    } else if (msg.type === 'error') {
      log('Ошибка: ' + msg.text);
      setStatus('Ошибка');
      runBtn.disabled = false;
    } else if (msg.type === 'done') {
      setStatus('Дописываю файлы…');
      queue.then(() => {
        if (zipFiles.length) downloadZip();
        log('Готово. ' + msg.text);
        setStatus('Готово');
        runBtn.disabled = false;
      });
    }
  };
</script>
